name: Docs

# Builds the documentation site (user pages, specification and API: `mill docs.site`) and
# publishes it to GitHub Pages. The repository's Pages source must be "GitHub Actions"
# (Settings → Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one but never cancels a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The standard library facades (scalago-gostd) are generated from Go's API at build time.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: runtime/go.mod
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: docs-${{ runner.os }}-jvm-${{ hashFiles('build.mill', 'mill-build/**') }}
          restore-keys: docs-${{ runner.os }}-jvm-
      - name: build the site
        run: ./mill --ticker false docs.site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/docs/site.dest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
